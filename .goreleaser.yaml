version: 2

builds:
  - main: ./cmd/huddle
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - description: Terminal UI for ClickUp tasks, GitHub issues and PRs, and coding agents in Rex
    homepage: https://github.com/slavafyi/huddle
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/huddle"]
          end
    repository:
      owner: slavafyi
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
